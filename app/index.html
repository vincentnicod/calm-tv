/* Built for a weak TV GPU: only transform and opacity ever animate; no blur, masks or filters. Everything a theme changes (manager > Theme) is a

:root {

  --dock-gap: 32px;

  --dock-panel: 0;
  --dock-pad: 0px;
  --dock-lift: -10px;
  --dock-fs: 1.05;

  --tile-w: 151px;
  --tile-h: 151px;
  --gap-x: 24px;

html,
body {

}
body {
  background-image: var(--wall);

}
::selection {

}

.glow {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 720px;
  opacity: 0;
  transition: opacity calc(0.35s * var(--spd)) linear;

  background: radial-gradient(ellipse 1400px 640px at 26% -6%, rgba(var(--c), 0.45), transparent 70%);
}

}

#top {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 5;
  pointer-events: none;
}
#clock {
  position: absolute;
  left: var(--clock-l);
  right: var(--clock-r);
  top: var(--clock-t);
  bottom: var(--clock-b);
  transform: var(--clock-tx);
  display: var(--clock-d);
  align-items: center;
  height: 76px;
}
#time {
  font-family: var(--font-d, var(--font));
  font-size: calc(56px * var(--fs) * var(--clock-s));
  font-weight: var(--clock-w);

  font-variant-numeric: tabular-nums;

}
#date {
  display: var(--date-d);

  color: var(--date-ink, rgba(245, 246, 248, 0.88));

  padding-top: 14px;
}
[data-clock="stack"] #clock {
  flex-direction: column;
  align-items: var(--clock-ai);
  height: auto;
}
[data-clock="stack"] #date {
  margin: 8px 0 0 6px;
  padding: 0;
}
#bar {
  pointer-events: auto;
  position: absolute;
  left: var(--bar-l);
  right: var(--bar-r);
  top: var(--bar-t);
  bottom: var(--bar-b);
  transform: var(--bar-tx);
  display: var(--bar-d);
  align-items: center;
  height: calc(var(--pill-h) + 12px);
}
#bar > * + * {
  margin-left: var(--bar-gap);
}
.pill {
  display: flex;
  align-items: center;
  justify-content: center;
  height: var(--pill-h);
  /* icon and word are centred as one; the icons' drawings sit 1 to 4 px inside their box, which equal padding evens out (measured by
     tools/calm-check.mjs on the pixels) */

}

}
.pill svg {

}

}
.pill.f {

#shelf {

/* the view clips rows as they scroll up under the shelf */
#view {
  position: absolute;
  left: 0;
  top: var(--view-top);
  width: 1920px;
  height: calc(1080px - var(--view-top));
  overflow: hidden;
  z-index: 2;
}
#scroll {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: calc(1080px - var(--view-top));
  transition: transform calc(0.3s * var(--spd)) ease-out;
  will-change: transform;
}
#dock {
  position: absolute;
  left: var(--dock-l);
  right: var(--dock-r);
  top: var(--dock-t);
  bottom: var(--dock-b);
  transform: var(--dock-tx);
  display: flex;
  z-index: 4;
  padding: var(--dock-pad);
  border-radius: calc(var(--dock-rad) + var(--dock-pad));
  background: rgba(255, 255, 255, var(--dock-panel));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, calc(var(--dock-panel) * 1.4));
}
#dock > * + * {
  margin-left: var(--dock-gap);
}
#grid {
  position: absolute;
  left: var(--grid-l);
  top: var(--grid-t);
  width: var(--grid-w);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gap-y) var(--gap-x);
}
/* an overlay grid: hidden until the focus moves down into it, then dark layer + grid over the screen above the dock */
[data-grid="overlay"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
[data-grid="overlay"] #scroll::before,
[data-grid="push"] #scroll::before {
  content: "";
  position: absolute;
  left: 0;
  top: -1600px;
  width: 1920px;
  height: 4400px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  background: rgba(var(--night-rgb), var(--ov-dim));
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #scroll::before,
[data-grid="push"].grid-open #scroll::before {
  opacity: 1;
}
/* push: the grid sits under the dock; focusing it scrolls the dock up and fades the grid in */
[data-grid="push"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.25s * var(--spd)) linear;
}
[data-grid="push"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
/* every row of tiles centred, also a last row that is not full */
[data-galign="center"] #grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}
[data-galign="center"] #grid .tile {
  width: var(--tile-w);
}
.tile::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: var(--gloss);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 46%, rgba(0, 0, 0, 0.24));
}

.tile {
  --c: 74, 84, 112;
  --b: 20, 22, 27;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
  background: rgb(var(--b));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, var(--tile-border));
  transition: transform calc(0.12s * var(--spd)) cubic-bezier(0.3, 1.35, 0.5, 1);
}
.snap .tile,
.snap .pill {
  transition: none;
} /* held arrow key: follow the focus without animating each step */
/* the picture's own box: it crops a picture that fills the tile, so the tile itself (and its focus ring and name) is never cut off */
.tile .face {
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tile.fill .face {
  overflow: hidden;
}
.tile.fill img {
  object-fit: fill;
}
.tile.press {
  transform: scale(0.96) !important;
  transition-duration: calc(0.06s * var(--spd));
}
.tile.launching {
  opacity: 0.82;
}
.tile img {
  object-fit: contain;
}
.tile svg {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.9;
}
.tile .t {
  font-size: calc(26px * var(--fs));
  font-weight: 600;
  padding: 12px;
  text-align: center;
  line-height: 1.15;
  opacity: 0.9;
}
/* The focus ring is a pseudo-element with its own radius: Chromium before 94 draws an outline as a rectangle, not around rounded corners. */
.tile.f {
  z-index: 3;
  box-shadow: 0 24px 36px rgba(0, 0, 0, 0.6);
}
.tile.f::before {
  content: "";
  position: absolute;
  pointer-events: none;
  left: calc(-1 * (var(--ring-off) + var(--ring-w)));
  top: calc(-1 * (var(--ring-off) + var(--ring-w)));
  right: calc(-1 * (var(--ring-off) + var(--ring-w)));
  bottom: calc(-1 * (var(--ring-off) + var(--ring-w)));
  border: var(--ring-w) solid var(--focus);
  border-radius: calc(var(--tile-r) + var(--ring-off) + var(--ring-w));
}
#dock .tile.f::before {
  border-radius: calc(var(--dock-rad) + var(--ring-off) + var(--ring-w));
}
#dock .tile {
  width: var(--dock-w);
  height: var(--dock-h);
  border-radius: var(--dock-rad);
}
#dock .tile img {
  height: 56%;
  max-width: 46%;
}
#dock .tile svg {
  width: 96px;
  height: 96px;
}
#dock .tile.f {
  transform: translateY(var(--dock-lift)) scale(var(--dock-fs));
}
#grid .tile {
  height: var(--tile-h);
  border-radius: var(--tile-r);
}
#grid .tile img {
  width: 64%;
  height: 64%;
}
#grid .tile svg {
  width: 64px;
  height: 64px;
}
#grid .tile.f {
  transform: scale(var(--grid-fs));
}
#grid .tile.sys {
  flex-direction: column;
}
#grid .tile.sys > * + * {

}
.slab {

  font-weight: 600;

}
#grid .tile.sys {

  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}

#toast {

}

}

/* ---------- names under the tiles, drawn icons, the HDMI card, "All apps" (calm.js) ---------- */
.tile .cap {
  position: absolute;
  left: 4px;
  right: 4px;
  top: 100%;
  margin-top: 18px;
  font-size: calc(28px * var(--fs));
  font-weight: 500;
  line-height: 1.2;
  color: var(--ink2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}
#dock .tile.f .cap {
  color: var(--ink);
}
/* a theme that shows the large name at the top needs no names under the dock */
[data-shelf="show"] #dock .tile .cap {
  display: none;
}
/* in the grid the name shows under the focused tile only, and only when the theme has no large name at the top */
#grid .tile .cap {
  left: -40px;
  right: -40px;
  margin-top: 12px;
  font-size: calc(22px * var(--fs));
  text-align: center;
  color: var(--ink);
  opacity: 0;
}
[data-shelf="hide"] #grid .tile.f .cap {
  opacity: 1;
}
.tile svg.glyph {
  color: #fff;

}
#dock .tile svg.glyph {

  height: 116px;
}
#grid .tile svg.glyph {
  width: 76px;
  height: 76px;
}
.tile svg.glyph text {

}
.gl-youtube {
  background-image: linear-gradient(160deg, #ff2a4f, #e8002b);
}
.gl-iptv {
  background-image: linear-gradient(140deg, #4b6cff, #8a4dff 60%, #b84dff);

/* the HDMI card's port, with a dot that is green while the device is on */
.chip {
  position: absolute;
  left: 22px;
  top: 20px;
  display: flex;
  align-items: center;
  height: 40px;
  padding: 0 16px 0 14px;
  border-radius: 20px;

}

}
/* a round button's name, under it while it has the focus */
.pill {
  position: relative;
}

  content: attr(data-label);

  left: 50%;
  top: 100%;
  margin-top: 14px;

}

}

#more {

/* ---------- the dock as cards (theme dock.style "card"): a dark card tinted with the app's colour, the icon small in the top corner,
   the name inside. The cards without the focus step back (dock.dim). ---------- */
[data-dockstyle="card"] #dock .tile {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0) 60%), var(--panel);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
  opacity: var(--dock-dim);
  transition:
    transform calc(0.16s * var(--spd)) cubic-bezier(0.25, 1, 0.4, 1),
    opacity calc(0.2s * var(--spd)) linear;
}
[data-dockstyle="card"] #dock .tile.f {
  opacity: 1;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
}
.tile .tint {

}
[data-dockstyle="card"] #dock .tile .tint {

  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;

  transition: opacity calc(0.25s * var(--spd)) linear;
}
[data-dockstyle="card"] #dock .tile.f .tint {

}
[data-dockstyle="card"] #dock .tile .face {

  top: 30px;

  bottom: auto;
  width: 76px;
  height: 76px;
  border-radius: 20px;

}
[data-dockstyle="card"] #dock .tile .face img {
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: contain;
}
[data-dockstyle="card"] #dock .tile svg.glyph {
  width: 46px;
  height: 46px;
}
[data-dockstyle="card"] #dock .tile .face .t {
  font-size: 18px;
  padding: 6px;
}
[data-dockstyle="card"] #dock .tile .cap {
  top: auto;
  bottom: 28px;
  left: 32px;
  right: 32px;
  margin: 0;
  font-size: calc(32px * var(--fs));
  font-weight: 600;
  line-height: 1.12;
  letter-spacing: -0.012em;

  -webkit-line-clamp: 2;
}
[data-dockstyle="card"] #dock .chip {
  left: auto;
  right: 30px;
  top: 30px;
  height: 30px;
  padding: 0;
  background: none;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--ink2);
}

/* ---------- docks of logos (calm.js makes them from the icons): `logo` with no tile, `glass` on frosted glass, `paper` on a card.
   A logo is white on a light ink and dark on a dark ink; in a tile filled with the accent (dock.focus "fill") it takes the accent's ink. */
.tile .mono,
.tile .mono .mw,
.tile .mono .mk {
  display: none;
}
[data-dockstyle="logo"] #dock .tile,
[data-dockstyle="glass"] #dock .tile,
[data-dockstyle="paper"] #dock .tile {
  color: var(--ink);
}
[data-dockstyle="logo"] #dock .tile {
  background: none;
  box-shadow: none;
}
[data-dockstyle="glass"] #dock .tile {
  background-color: rgba(255, 255, 255, 0.05);
  background-image: linear-gradient(rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04)), var(--glass, none);
  background-size:
    auto,
    1920px 1080px;
  background-repeat: no-repeat;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.3),
    inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}
[data-dockstyle="paper"] #dock .tile {
  background: var(--panel);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.8),
    0 10px 30px rgba(60, 50, 40, 0.12);
}
[data-dockstyle="logo"] #dock .tile:not(.gl) .face,
[data-dockstyle="glass"] #dock .tile:not(.gl) .face,
[data-dockstyle="paper"] #dock .tile:not(.gl) .face,
[data-dockstyle="logo"] #dock .chip,
[data-dockstyle="glass"] #dock .chip,
[data-dockstyle="paper"] #dock .chip {
  display: none;
}
[data-dockstyle="logo"] #dock .tile svg.glyph,
[data-dockstyle="glass"] #dock .tile svg.glyph,
[data-dockstyle="paper"] #dock .tile svg.glyph {
  width: 50px;
  height: 50px;
  color: inherit;
}
[data-dockstyle="paper"] #dock .tile svg.glyph {
  width: 64px;
  height: 64px;
}
[data-dockstyle="logo"] #dock .tile .mono,
[data-dockstyle="glass"] #dock .tile .mono,
[data-dockstyle="paper"] #dock .tile .mono {
  display: flex;
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  align-items: center;
  justify-content: center;
  padding: 0 26px;
  pointer-events: none;
}
[data-dockstyle="logo"] #dock .mono img,
[data-dockstyle="glass"] #dock .mono img,
[data-dockstyle="paper"] #dock .mono img {
  max-width: 100%;
  max-height: 40px;
}
[data-dockstyle="paper"] #dock .mono img {
  max-height: 52px;
}
[data-dockstyle="logo"] #dock .mono .mt,
[data-dockstyle="glass"] #dock .mono .mt,
[data-dockstyle="paper"] #dock .mono .mt {
  font-size: calc(27px * var(--fs));
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
[data-inkmode="light"] #dock .tile:not(.f) .mono .mw,
[data-inkmode="dark"] #dock .tile:not(.f) .mono .mk,
[data-dockfocus="fill"][data-accmode="light"] #dock .tile.f .mono .mw,
[data-dockfocus="fill"][data-accmode="dark"] #dock .tile.f .mono .mk,
[data-dockfocus="lift"][data-inkmode="light"] #dock .tile.f .mono .mw,
[data-dockfocus="lift"][data-inkmode="dark"] #dock .tile.f .mono .mk,
[data-dockfocus="ring"][data-inkmode="light"] #dock .tile.f .mono .mw,
[data-dockfocus="ring"][data-inkmode="dark"] #dock .tile.f .mono .mk {
  display: block;
}
/* the focused logo's name, under it (logo and glass); a paper card keeps every name under it */
[data-dockstyle="logo"] #dock .tile .cap,
[data-dockstyle="glass"] #dock .tile .cap {
  display: block;
  left: -60px;
  right: -60px;
  margin: 12px 0 0;
  text-align: center;
  font-size: calc(22px * var(--fs));
  font-weight: 500;
  color: var(--ink);
  opacity: 0;
}
[data-dockstyle="logo"] #dock .tile.f .cap,
[data-dockstyle="glass"] #dock .tile.f .cap {
  opacity: 1;
}
[data-dockstyle="paper"] #dock .tile .cap {
  margin-top: 20px;
  font-size: calc(24px * var(--fs));
}

/* ---------- focus: "fill" fills the tile with the accent; "lift" brightens glass; both instead of a ring ---------- */
[data-dockfocus="fill"] #dock .tile,
[data-dockfocus="lift"] #dock .tile {
  transition: transform calc(0.14s * var(--spd)) cubic-bezier(0.25, 1, 0.4, 1);
}
[data-dockfocus="fill"] #dock .tile.f::before,
[data-dockfocus="lift"] #dock .tile.f::before {
  display: none;
}
[data-dockfocus="fill"] #dock .tile.f {
  background: var(--acc);
  color: var(--acc-ink);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
}
[data-dockfocus="lift"] #dock .tile.f {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.55),
    inset 0 0 0 1px rgba(255, 255, 255, 0.14),
    0 34px 70px rgba(0, 0, 0, 0.45);
}
[data-dockfocus="lift"] #dock .tile .tint {
  display: block;
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;
  pointer-events: none;
  background: rgba(255, 255, 255, 0.16);
  opacity: 0;
  transition: opacity calc(0.18s * var(--spd)) linear;
}
[data-dockfocus="lift"] #dock .tile.f .tint {
  opacity: 1;
}

/* ---------- a dock of words (dock.style "word"): the names in the display typeface, no icons; the focused one in italic over a hairline,
   the number of its key above each ---------- */
[data-dockstyle="word"] #dock {
  align-items: baseline;
  counter-reset: dk;
}
[data-dockstyle="word"] #dock .tile {
  display: block;
  width: auto;
  height: auto;
  background: none;
  box-shadow: none;
}
[data-dockstyle="word"] #dock .tile.f {
  transform: none;
  box-shadow: none;
}
[data-dockstyle="word"] #dock .tile .face,
[data-dockstyle="word"] #dock .tile .mono,
[data-dockstyle="word"] #dock .chip,
[data-dockstyle="word"] #dock .tint {
  display: none;
}
[data-dockstyle="word"] #dock .tile .cap {
  display: block;
  position: static;
  margin: 0;
  font-family: var(--font-d, var(--font));
  font-size: calc(64px * var(--fs));
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--ink);
  opacity: 0.32;
  white-space: nowrap;
  max-width: 760px; /* a very long name ends in an ellipsis instead of pushing the row off the screen */
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 8px;
}
[data-dockstyle="word"] #dock .tile.f .cap {
  opacity: 1;
  font-style: italic;
}
[data-dockstyle="word"] #dock .tile.f::before {
  left: 0;
  right: 0;
  top: auto;
  bottom: -24px;
  height: 1px;
  border: 0;
  border-radius: 0;
  background: var(--ink);
  opacity: 0.55;
}
[data-dockstyle="word"] #dock .tile::after {
  counter-increment: dk;
  content: counter(dk);
  left: 2px;
  top: -30px;
  right: auto;
  bottom: auto;
  background: none;
  opacity: 0.35;
  font: 500 15px var(--font);
  letter-spacing: 0.14em;
  color: var(--ink);
}
[data-dockstyle="word"] #dock .tile.f::after {
  opacity: 0.75;
}

/* ---------- top buttons as words (bar.style "text", or "caps" in small spaced capitals), the focused one in a pill ---------- */
[data-bar="text"] .pill,
[data-bar="caps"] .pill {
  padding: 0 24px;
}
[data-bar="text"] .pill:not(.f),
[data-bar="caps"] .pill:not(.f) {
  background: none;
  box-shadow: none;
  color: var(--ink2);
}
[data-bar="text"] .pill svg,
[data-bar="caps"] .pill svg {
  display: none;
}
/* the icon is hidden, so the word keeps no gap for it: it sits in the middle of its pill */
[data-bar="text"] .pill > * + *,
[data-bar="caps"] .pill > * + * {
  margin-left: 0;
}
/* the spacing of capitals follows every letter, the last one too: taken back after the word so it stays centred */
[data-bar="caps"] .pill span {
  margin-right: -0.2em;
}
[data-bar="caps"] .pill {
  font-size: calc(16px * var(--fs));
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
[data-bar="caps"] #more {
  font-size: calc(15px * var(--fs));
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
[data-datecase="caps"] #date {
  text-transform: uppercase;
  letter-spacing: 0.24em;
}

/* ---------- a clock at the bottom steps aside while the app grid is open ---------- */
#clock {
  transition: opacity calc(0.2s * var(--spd)) linear;
}
[data-clockpos="bottom"].grid-open #clock {
  opacity: 0;
}

/* ---------- night mode (22:00 to 6:00) and the idle screen (calm.js): a veil over Home, only opacity changes ---------- */
#veil {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 20;
  pointer-events: none;
  background: #140c02;
  opacity: 0;
  transition: opacity 1.2s linear;
}
.night #veil {
  opacity: 0.24;
}
.idle #veil {
  background: #000;
  opacity: 0.42;
  transition-duration: 2.5s;
}
#view,
#bar,
#shelf {
  transition: opacity 0.9s linear;
}
#top {
  transition: transform 4s ease-in-out;
}
body.idle #view,
body.idle #bar,
body.idle #shelf,
body.idle #more,
body.idle .glow {
  opacity: 0 !important;
}

/* an input on Home: the service keeps it and lists it with the apps (helper/apps.js) */
function pinInput(id, name, on) {
  api('/api/inputs/pin', { id: id, on: on }).then(
    function (x) {
      if (!x || x.returnValue !== true) return toast(t('Could not change Home'));
      toast((on ? t('%s added to Home') : t('%s removed from Home')).replace('%s', name));
      lastSig = '';
      load();
    },
    function () {
      toast(t('Could not change Home'));
    }
  );
}
function isPinned(id) {
  return apps.some(function (a) {
    return a.id === id && a.input;
  });
}

/* Sunrise and sunset (ms) of a calendar day (the UTC date of ms) at a latitude and longitude: the sunrise equation (NOAA's simplified
   form, within three minutes in Switzerland), worked out on the TV; nothing is asked of the network. null on a day without both (polar day
   or night) */
function sunTimes(ms, lat, lon) {
  var rad = Math.PI / 180,
    n = Math.floor(ms / 86400000) - 10957 /* days from 1 January 2000 */,

    sd = Math.sin(l * rad) * Math.sin(23.4397 * rad),
    cw = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sd) / (Math.cos(lat * rad) * Math.cos(Math.asin(sd)));

  if (code === 0) return t('Clear');

  if (code === 2) return t('Partly cloudy');
  if (code === 3) return t('Overcast');
  if (code === 45 || code === 48) return t('Fog');
  if (code >= 51 && code <= 57) return t('Drizzle');
  if ((code >= 61 && code <= 67) || code === 80 || code === 81 || code === 82) return code >= 80 ? t('Showers') : t('Rain');
  if (code >= 71 && code <= 77) return t('Snow');

        ? 'jour'
        : now >= s.set - 90 * M && now < s.set + 40 * M
          ? ''

}

      function (r) {

        msg(head + '<div>' + t(WHY[r.reason] || WHY.unknown) + '</div>' + tail);

  /* defer: while zapping (Up/Down) the new channel starts only once the keys have paused, so skipped channels never reach the provider */

  function pickStream(i) {

  /* ---------- the banner ---------- */
  function hm(ts) {

  }
  function facts(c) {

  function fillOsd() {

  function loadEpg(ids, cb) {

      .then(function (x) {

  setInterval(function () {

  /* ---------- the guide: tabs, favourites, recents, filters, search ---------- */
  var full = {};
  function cname(code) {
    try {
      if (window.Intl && Intl.DisplayNames) {
        var n = new Intl.DisplayNames([LOC], { type: 'region' }).of(code);
        if (n && n !== code) return n;
      }
    } catch (e) {}
    return code;
  }
  function passes(c) {
    if (F.cc && c.cc !== F.cc) return false;
    if (F.lang && c.lang !== F.lang) return false;
    if (F.q && c.q !== F.q) return false;
    if (Q) {
      var s = (c.name + ' ' + c.cc + ' ' + cname(c.cc || '') + ' ' + c.lang + ' ' + c.cats.join(' ')).toLowerCase();
      if (s.indexOf(Q) < 0) return false;

    return true;
  }
  function baseList(g) {
    if (g === 0) return chans;
    if (g === 1)
      return S.fav
        .map(function (k) {
          return byKey[k];
        })
        .filter(Boolean);
    if (g === 2)
      return S.recent
        .map(function (k) {
          return byKey[k];
        })
        .filter(Boolean);
    var n = groups[g - 3];
    return chans.filter(function (c) {
      return c.cats.indexOf(n) >= 0;
    });
  }
  function listFor(g) {

  function tabNames() {

  }
  function gcolor() {

  }
  function openList() {

  function closeList() {

  function pct(p, now) {

  }
  var STAR = '<svg class="st" viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z"/></svg>';
  function badges(c) {

    if (c.fl & 4) h += '<span class="bd w">HEADERS</span>';

  function filterText() {

  function drawList() {

      }

  function fetchVisible() {
    clearTimeout(fetchT);

          .slice(cs, cs + 7)
          .map(function (c) {

          .filter(function (i) {

        loadEpg(ids, function () {

      if (c && c.id && !full[c.id])
        api('/api/live/epg?full=1&ids=' + encodeURIComponent(c.id))
          .then(function (x) {

  }
  function relist() {

  /* search: the TV's own keyboard types into an input; the list follows what is typed */
  function startSearch() {

  /* filters */
  function fvals(k) {

  function filterRows() {
    return [
      { k: 'cc', label: t('Country'), val: F.cc ? cname(F.cc) : t('All') },
      { k: 'lang', label: t('Language'), val: F.lang || t('All') },
      { k: 'q', label: t('Quality'), val: F.q || t('All') },
      { k: 'clear', label: t('Clear filters'), val: '' },
    ];
  }
  function drawFilter() {
    var r = filterRows(),
      h = '<h3>' + lesc(t('Filters')) + '</h3>';
    for (var i = 0; i < r.length; i++)
      h +=
        '<div class="mrow' +

  }
  function stepFilter(k, d) {
    var v = fvals(k),
      i = v.indexOf(F[k]);

    relist();
    drawFilter();
  }
  function filterKey(k) {
    if (k === 38) {
      if (FP.i > 0) FP.i--;
    } else if (k === 40) {
      if (FP.i < 3) FP.i++;
    } else if (k === 37 || k === 39) {
      var r = filterRows()[FP.i];
      if (r.k !== 'clear') stepFilter(r.k, k === 37 ? -1 : 1);
      return;
    } else if (k === 13) {
      var r2 = filterRows()[FP.i];
      if (r2.k === 'clear') {
        F = { cc: '', lang: '', q: '' };
        relist();
      } else FP.open = false;
    } else if (k === 405 || k === 461 || k === 27 || k === 8) {

      drawList();
      return;

    drawFilter();

  /* the player menu (Yellow while watching) */

  /* statistics (Blue while watching): what the TV tells a web page about the picture */

      t('Stream') +

  function setup() {
    api('/api/live/pair', {}).then(function (p) {

          t('Open this address on your phone or computer:') +

          '</b><div>' +
          t('and enter this code:') +
          '</div><b>' +

          '</div>'

        if (!o.on) {
          clearInterval(setupT);
          return;
        }

          if (s.configured) {
            clearInterval(setupT);
            boot();
          }
        });
      }, 2500);
    });
  }
  function facets() {
    function top(k) {
      var n = {};
      chans.forEach(function (c) {
        if (c[k]) n[c[k]] = (n[c[k]] || 0) + 1;
      });
      return Object.keys(n)
        .sort(function (a, b) {
          return n[b] - n[a] || (a < b ? -1 : 1);
        })
        .slice(0, 40);
    }
    fac = {
      cc: top('cc'),
      lang: top('lang'),
      q: ['SD', 'HD', 'FHD', '4K'].filter(function (q) {
        return chans.some(function (c) {
          return c.q === q;
        });
      }),
    };
  }
  function boot() {
    msg('<div>' + t('Loading channels...') + '</div>');
    api('/api/live/status')
      .then(function (s) {
        if (!s.configured) {
          setup();
          return;
        }
        var tries = 0;
        (function load() {
          if (!o.on) return;
          api('/api/live/channels').then(function (x) {
            if (!x.channels.length) {
              if (++tries > 40) {
                msg('<div>' + lesc(s.error || 'No channels') + '</div>');
                return;
              }
              setTimeout(load, 2000);
              return;
            }
            groups = x.groups;
            chans = x.channels.map(function (r) {
              return {
                num: r[0],
                id: r[1],
                name: r[2],
                group: r[3],
                logo: r[4],
                url: r[5],
                key: r[6] || '',
                cc: r[7] || '',
                lang: r[8] || '',
                q: r[9] || '',
                fl: r[10] || 0,
                cats: r[11] || (r[3] ? [r[3]] : []),
                alt: (r[12] || []).map(function (a) {
                  return { url: a[0], q: a[1] };
                }),
              };
            });
            byNum = {};
            byKey = {};
            chans.forEach(function (c) {
              byNum[c.num] = c;
              if (c.key) byKey[c.key] = c;
            });
            loaded = true;
            facets();
            var last = 0;
            try {
              last = parseInt(localStorage.getItem('live.last'), 10);
            } catch (e) {}
            api('/api/live/state')
              .then(
                function (st) {
                  S = { fav: st.fav || [], recent: st.recent || [], failed: st.failed || {} };
                },
                function () {}
              )
              .then(function () {
                layer('lv-msg', false);
                play(byNum[last] ? last : chans[0].num);
                if (guideNext) {
                  guideNext = false;
                  openList();
                }
              });
