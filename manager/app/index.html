function api(p, body, ms) {
  return new Promise(function (res, rej) {
    var x = new XMLHttpRequest();
    x.open(body ? 'POST' : 'GET', API + p);
    x.timeout = ms || 30000;
    x.onload = function () {
      try {
        res(JSON.parse(x.responseText));
      } catch (e) {
        rej(e);
      }
    };
    x.onerror = x.ontimeout = function () {
      rej(new Error('no answer'));
    };
    x.send(body ? JSON.stringify(body) : null);
  });
}
function rootExec(cmd) {
  return new Promise(function (res) {
    try {
      var b = new PalmServiceBridge();
      b.onservicecallback = function (m) {
        res(m);
      };
      b.call('luna://org.webosbrew.hbchannel.service/exec', JSON.stringify({ command: cmd }));
    } catch (e) {
      res(JSON.stringify({ returnValue: false, errorText: String(e) }));
    }
  });
}

function offlineUpdate() {
  if (!upd) return;
  banner('Updating to ' + upd.updateTo + '\u2026', 'work');
  rootExec('rm -f /tmp/cytv-selfupdate.log; nohup node ' + SVC + '/helper/selfupdate.js install > /tmp/cytv-selfupdate.log 2>&1 &').then(
    function () {
      pollUpdate(0);

function pollUpdate(n) {
  rootExec('tail -n 3 /tmp/cytv-selfupdate.log 2>/dev/null').then(function (m) {
    var t = execOut(m).out.trim(),
      last = t.split('\n').pop();
    if (/^DONE/.test(last)) {
      upd = null;
      banner(last.replace(/^DONE /, ''), 'ok');
      build();
      draw();
      return;
    }
    if (/^ERROR/.test(last)) {
      banner('Update failed: ' + last.replace(/^ERROR /, ''), 'err');
      return;
    }
    if (n > 120) {
      banner('The update is taking too long. Log: /tmp/cytv-selfupdate.log on the TV.', 'err');
      return;
    }
    if (last) banner('Updating\u2026 ' + last, 'work');
    setTimeout(function () {
      pollUpdate(n + 1);
    }, 2000);
  });
}

                      kStep('input');
                    },
                  },
                  {
                    label: 'Skip',
                    fn: function () {
                      kStep('done');
                    },
                  },
                ]
              );
              return;
            }
            poll();
          },
          function () {
            poll();
          }
        );
      }, 700);
    })();
  });
}
function drawQr(url) {
  var q = qrcode(0, 'M');
  q.addData(url);
  q.make();
  var n = q.getModuleCount(),
    cell = Math.max(4, Math.floor(640 / (n + 8))),
    cv = $('qr'),
    size = cell * (n + 8),
    g;
  cv.width = cv.height = size;
  g = cv.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, size, size);
  g.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect((c + 4) * cell, (r + 4) * cell, cell, cell);
}
function openShare() {
  shareMode = 'log';
  push('share');
  $('share').querySelector('h2').textContent = 'Share the log';
  $('share').querySelector('ol').innerHTML =
    '<li>Phone on the <b>same Wi-Fi</b> as the TV.</li><li>Scan the code with the camera.</li><li>Tap <b>Copy</b> on the page and paste it into your message.</li>';
  $('share').style.display = 'block';
  $('shareurl').textContent = '';
  $('qrbox').style.visibility = 'hidden';
  $('sharemsg').textContent = 'Preparing the report\u2026';
  rootExec('rm -f /tmp/cytv-sharelog.json; nohup node ' + SVC + '/helper/sharelog.js > /tmp/cytv-sharelog.out 2>&1 &').then(function () {
    pollShare(0);
  });
}
function pollShare(n) {
  if (view !== 'share') return;
  rootExec('cat /tmp/cytv-sharelog.json 2>/dev/null').then(function (m) {
    var st = null;
    try {
      st = JSON.parse(JSON.parse(m).stdoutString || 'null');
    } catch (e) {}
    if (st && st.url) {
      drawQr(st.url);
      $('qrbox').style.visibility = 'visible';
      $('shareurl').textContent = st.url;
      $('sharemsg').textContent =
        'The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.';
      return;
    }
    if (n > 45) {
      $('sharemsg').textContent = 'Could not prepare the report (is the Homebrew Channel installed?).';
      return;
    }
    setTimeout(function () {
      pollShare(n + 1);
    }, 1000);
  });
}
function closeShare() {
  $('share').style.display = 'none';
  if (shareMode === 'notify') {
    pop();
    return;
  }
  if (shareMode === 'live') {
    pop();
    liveRefresh();
    return;
  }
  if (shareMode === 'pair') {
    api('/api/voice/pair-stop', {}).catch(function () {});
    pop();
    voiceRefresh();
    return;
  }
  rootExec('pkill -f "[s]harelog.js"; rm -f /tmp/cytv-sharelog.json');
  pop();
}
function doSetup(force) {
  forceOffer = false;
  banner('Setting up\u2026 the screen blinks once while LG\u2019s system restarts', 'work');
  var flags =
    (setup.debloat ? '--debloat' : '--no-debloat') + ' ' + (setup.inputKey ? '--input-key' : '--no-input-key') + (force ? ' --force' : '');
  rootExec(
    'rm -f /media/developer/cytv-setup.log*; nohup sh ' +
      SVC +
      '/bootstrap.sh install ' +
      flags +
      ' > /media/developer/cytv-setup.log 2>&1 &'
  ).then(function (m) {
    var o = {};
    try {
      o = JSON.parse(m);
    } catch (e) {}
    if (o.returnValue === false) {
      banner(
        'Could not start the setup: ' + (o.errorText || 'no answer from the Homebrew Channel service (is it installed and up to date?)'),
        'err'
      );
      return;
    }
    waitUp(0);
  });
}
function logTail(cb) {
  rootExec('tail -n 3 /media/developer/cytv-setup.log 2>/dev/null').then(function (m) {
    var o = {};
    try {
      o = JSON.parse(m);
    } catch (e) {}
    cb(
      String(o.stdoutString || '')
        .replace(/\[cleanyourtv\] /g, '')
        .trim()
    );
  });
}
function waitUp(n) {
  api('/api/manager/status').then(
    function (s0) {
      offline = false;
      banner('');
      load();
      if (!(s0.keys && s0.keys.learned) && s0.options && s0.options.inputKey)
        setTimeout(function () {
          api('/api/manager/status').then(function (s) {
            st = s;
            openKeys('input');
          });
        }, 1500);
    },
    function () {
      logTail(function (t) {
        if (/ERROR|rolled back/.test(t)) {
          forceOffer = /looks different/.test(t);
          build();
          draw();
          banner(
            'Setup stopped: ' +
              t
                .split('\n')
                .pop()
                .replace(/^ERROR: /, ''),
            'err'
          );
          return;
        }
        if (n > 90) {
          banner('The service did not start. Log: /media/developer/cytv-setup.log on the TV. ' + t.split('\n').pop(), 'err');
          return;
        }
        if (t) banner('Setting up\u2026 ' + t.split('\n').pop(), 'work');
        setTimeout(function () {
          waitUp(n + 1);
        }, 2000);
      });
    }
  );
}
document.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  if (k === 38) next(-1);
  else if (k === 40) next(1);
  else if (k === 13) act();
  else if (k === 461 || k === 27 || k === 8 || k === 10009) {
    if (view === 'share') closeShare();
    else if (view === 'keys') closeKeys();
    else if (view !== 'main') pop();
    else {
      try {
        window.close();
      } catch (x) {}
    }
  }
  e.preventDefault();
});
document.addEventListener('click', function (e) {
  if (e.target.closest && e.target.closest('#shareclose')) {
    closeShare();
    return;
  }
  var r = e.target.closest && e.target.closest('.row');
  if (r) {
    idx = +r.getAttribute('data-i');
    draw();
    act();
  }
});
document.addEventListener('mousemove', function (e) {
  var r = e.target.closest && e.target.closest('.row');
  if (r && +r.getAttribute('data-i') !== idx) {
    idx = +r.getAttribute('data-i');
    draw();
  }
});
document.addEventListener('wheel', function (e) {
  if (e.deltaY > 0) next(1);
  else if (e.deltaY < 0) next(-1);
}); /* the Magic Remote wheel */
document.addEventListener('webOSRelaunch', function () {
  view = 'main';
  idx = 0;
  idxStack = [];
  listY = 0;
  load();
});
banner('Reading status…', 'work');
load();
</script></body></html>
